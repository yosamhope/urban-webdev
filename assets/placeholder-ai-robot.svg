<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- Dark background -->
  <rect width="400" height="400" fill="#1a1a2e"/>
  
  <!-- AI Robot with neon glow effect -->
  <defs>
    <radialGradient id="robotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff4444;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#ff4444;stop-opacity:0" />
    </radialGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Glow effect -->
  <circle cx="200" cy="200" r="120" fill="url(#robotGlow)"/>
  
  <!-- Robot head -->
  <rect x="140" y="80" width="120" height="120" rx="15" fill="none" stroke="#ff4444" stroke-width="3" filter="url(#neonGlow)"/>
  
  <!-- Robot eyes -->
  <circle cx="170" cy="120" r="12" fill="none" stroke="#ff4444" stroke-width="3" filter="url(#neonGlow)"/>
  <circle cx="230" cy="120" r="12" fill="none" stroke="#ff4444" stroke-width="3" filter="url(#neonGlow)"/>
  
  <!-- Eye glows -->
  <circle cx="170" cy="120" r="6" fill="#ff4444" opacity="0.8" filter="url(#neonGlow)"/>
  <circle cx="230" cy="120" r="6" fill="#ff4444" opacity="0.8" filter="url(#neonGlow)"/>
  
  <!-- Robot mouth line -->
  <path d="M 170 160 Q 200 175 230 160" stroke="#ff4444" stroke-width="2" fill="none" filter="url(#neonGlow)"/>
  
  <!-- Robot body -->
  <rect x="150" y="210" width="100" height="110" rx="10" fill="none" stroke="#ff4444" stroke-width="3" filter="url(#neonGlow)"/>
  
  <!-- Chest circuit -->
  <rect x="175" y="235" width="50" height="35" fill="none" stroke="#ff4444" stroke-width="2" filter="url(#neonGlow)"/>
  <circle cx="185" cy="252" r="4" fill="#ff4444" filter="url(#neonGlow)"/>
  <circle cx="200" cy="245" r="4" fill="#ff4444" filter="url(#neonGlow)"/>
  <circle cx="215" cy="252" r="4" fill="#ff4444" filter="url(#neonGlow)"/>
  
  <!-- Arms -->
  <g filter="url(#neonGlow)">
    <rect x="80" y="235" width="60" height="20" rx="10" fill="none" stroke="#ff4444" stroke-width="2"/>
    <rect x="260" y="235" width="60" height="20" rx="10" fill="none" stroke="#ff4444" stroke-width="2"/>
  </g>
  
  <!-- Hand indicators -->
  <circle cx="85" cy="245" r="5" fill="#ff4444" opacity="0.8" filter="url(#neonGlow)"/>
  <circle cx="315" cy="245" r="5" fill="#ff4444" opacity="0.8" filter="url(#neonGlow)"/>
  
  <!-- Placeholder text -->
  <text x="200" y="360" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-weight="bold">AI Robot Image</text>
  <text x="200" y="385" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.3)" text-anchor="middle">(Replace with actual image)</text>
</svg>